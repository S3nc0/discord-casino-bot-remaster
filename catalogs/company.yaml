# 会社（自分だけの会社・事業所。すべて帝愛の子会社）
# 買取の代金は、帝愛の胴元の口座から出る（その残高を超えては払わない＝新しくペリカを作らない）
found_fee: 1000000        # 設立費（帝愛銀行に入る）
name_max: 12              # 社名の長さ
build_costs: [300000, 600000, 1200000, 2400000, 4800000]  # 事業所を Lv1〜5 にする建設費（胴元の口座に入る）
upkeep_rate: 0.003        # 1日の維持費（建設費の累計に対して。胴元の口座に入る）
pinhane_rate: 0.03        # 買取額から、帝愛が引くピンハネ
storage_days: 3           # 倉庫に置ける量（ふつうの日の生産の、何日分か）。あふれた分は捨てる
bankrupt_days: 3          # 維持費を払えない日が、この日数続くと倒産

# 事業所の種類。yield_rate は、1日の生産（買取価格 1.0 倍のときの額。建設費の累計に対して）。
# conditions は日替わりの状態。weight の比で選ばれ、その日の生産量（yield_mult）と買取価格（price_lo〜price_hi）を決める
kinds:
  - key: farm
    name: "農場"
    yield_rate: 0.009
    conditions:
      - {key: sunny,   weight: 40, yield_mult: 1.0, price_lo: 0.9, price_hi: 1.1}
      - {key: rain,    weight: 20, yield_mult: 1.3, price_lo: 0.8, price_hi: 1.0}
      - {key: bumper,  weight: 10, yield_mult: 1.8, price_lo: 0.6, price_hi: 0.8}
      - {key: drought, weight: 15, yield_mult: 0.5, price_lo: 1.3, price_hi: 1.5}
      - {key: storm,   weight: 5,  yield_mult: 0.1, price_lo: 1.5, price_hi: 1.9}
      - {key: season,  weight: 10, yield_mult: 1.0, price_lo: 1.4, price_hi: 1.6}
  - key: mine
    name: "採掘場"
    yield_rate: 0.012
    conditions:
      - {key: steady,  weight: 1,  yield_mult: 1.0, price_lo: 0.9, price_hi: 1.1}
