# Cloudflare Tunnel configuration template.
# Copy to ~/.cloudflared/config.yml (macOS) or /etc/cloudflared/config.yml (Raspberry Pi)
# and replace the placeholders below. Never commit real tunnel IDs, credentials, or domains.

tunnel: YOUR_TUNNEL_ID
credentials-file: /path/to/.cloudflared/YOUR_TUNNEL_ID.json

ingress:
  - hostname: api.example.com
    service: http://localhost:3001
  - service: http_status:404
